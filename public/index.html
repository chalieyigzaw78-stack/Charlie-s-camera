<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Camera</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="eyebrow"><span class="dot"></span>HOME CAMERA</div>
  <h1>Watch your place, from anywhere</h1>
  <p class="sub">One phone is the eye. The other one watches. Pick which one this phone is.</p>

  <button class="role-btn" onclick="location.href='camera.html'">
    <div class="name">📷 Set up as Camera</div>
    <div class="desc">This phone stays put and streams live video from where it's placed.</div>
  </button>

  <button class="role-btn" onclick="location.href='viewer.html'">
    <div class="name">📱 Set up as Viewer</div>
    <div class="desc">Watch the camera live, talk through it, and record clips.</div>
  </button>
</div>
<div class="credit-footer">Developed by Chalie Yigzaw</div>
